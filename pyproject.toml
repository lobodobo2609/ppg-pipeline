[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-pipeline"
version = "0.1.0"
description = "Filtering, beat detection, signal quality and feature extraction for PPG waveforms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "pyyaml>=6.0", "wfdb>=4.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "neurokit2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
